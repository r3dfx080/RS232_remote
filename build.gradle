plugins {
    id 'java'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '1.8.12'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
}

group 'org.foxprod'
version '0.8'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '21'
targetCompatibility = '21'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'org.foxprod.rs232_remote'
    mainClass = 'org.foxprod.rs232_remote.Main'
}

jar {
    manifest {
        attributes "Main-Class": 'org.foxprod.rs232_remote.Main'
    }
}

javafx {
    version = '21'
    modules = ['javafx.base', 'javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation("com.fazecast:jSerialComm:[2.0.0,3.0.0)")
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")
}

test {
    useJUnitPlatform()
}

jlink {
    jpackage {
        def winIcon = "${projectDir}/src/main/resources/org/foxprod/rs232_remote/icon.ico"
        icon = winIcon
        imageOptions = ['--icon', winIcon]
        skipInstaller = true
        //installerOptions = ['--icon', winIcon]
        //installerType = 'exe'
        targetPlatformName = "win"
        appVersion = getAppVersion()
    }
    imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
    targetPlatform("win") {
    }
    options = ['--strip-debug', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'RS232 remote'
    }
}

tasks.named('jpackage') {
    dependsOn(test)
}

tasks.jpackage.doLast {
    copy {
        from project.projectDir
        include "config.properties"
        into "$buildDir/jpackage/${jlink.launcherData.get().name}"
    }
}

jlinkZip {
    group = 'distribution'
}